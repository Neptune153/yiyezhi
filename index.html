<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="description" content="澄潇宇《考研政治一页纸》27 版与 26 版本地背诵站总览">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 3h12l6 6v20H7z' fill='%23ffffff' stroke='%23334155' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M19 3v6h6' fill='none' stroke='%23334155' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M11 15h10M11 19h10M11 23h6' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>澄潇宇一页纸 · 27 / 26 版</title>
  <link rel="stylesheet" href="27/assets/css/main.css">
</head>
<body class="home-mode">
  <div class="app">
    <header class="topbar">
      <a class="brand" href="index.html">一页纸</a>
      <nav class="nav" aria-label="主导航">
        <a class="nav-trigger is-active" href="index.html">背诵</a>
      </nav>
      <span class="topbar-spacer"></span>
    </header>

    <main class="main">
      <div class="page">
        <div class="crumb">
          <a href="index.html">政治</a><span class="sep"> / </span><span>背诵</span>
        </div>

        <h1 class="page-title lg">一页纸</h1>
        <p class="page-sub">澄潇宇《考研政治一页纸》· 选择版本进入对应背诵站。</p>

        <h2 class="shelf-group">澄潇宇</h2>
        <div class="book-grid">
          <a class="book-card" data-book="chengxiaoyu-yiyezhi" href="27/index.html#/read/s01" aria-label="进入 27 考研一页纸">
            <h3 class="book-title">27考研一页纸</h3>
            <p class="book-meta">2027 版 · 15 节 · 100 个知识点</p>
            <p class="book-blurb">考研政治知识点手册，马原 / 史纲 / 其他三部分，100 个知识点一页速览。</p>
            <p class="book-progress" hidden></p>
          </a>
          <a class="book-card" data-book="chengxiaoyu-26yiyezhi" href="26/index.html#/read/s01" aria-label="进入 26 考研一页纸">
            <h3 class="book-title">26考研一页纸</h3>
            <p class="book-meta">2026 版 · 21 节 · 234 个知识点</p>
            <p class="book-blurb">2026 版一页纸，按原 PDF 的卡片顺序重排，保留彩色标注。</p>
            <p class="book-progress" hidden></p>
          </a>
        </div>

        <p class="foot">背诵内容来自《27考研政治一页纸-知识点手册.pdf》与《26考研政治一页纸-知识点手册》。</p>
      </div>
    </main>
  </div>
  <script>
    (function () {
      var cards = document.querySelectorAll(".book-card[data-book]");
      Array.prototype.forEach.call(cards, function (card) {
        var key = "yy_last_read:" + card.getAttribute("data-book");
        try {
          var last = JSON.parse(localStorage.getItem(key) || "null");
          if (!last || !last.id || !/^[a-z0-9-]+$/i.test(last.id)) return;
          card.href = card.getAttribute("href").split("#")[0] + "#/read/" + encodeURIComponent(last.id);
          var line = card.querySelector(".book-progress");
          if (line && last.title) {
            line.textContent = "上次读到：" + last.title;
            line.hidden = false;
          }
        } catch (e) {}
      });
    })();
  </script>
</body>
</html>
